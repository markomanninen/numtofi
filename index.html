<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Finnish Text</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #FFFFFF; /* Clean white background */
            color: #002F6C; /* Official dark blue for text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff; /* White container background */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 47, 108, 0.3); /* Shadow themed with Finnish blue */
            text-align: center;
            border: 5px solid #003580; /* Thicker, primary Finnish blue border */
        }
        h1 {
            color: #002F6C; /* Official dark blue for heading */
        }
        input[type="number"] {
            padding: 10px;
            margin-top: 10px;
            border: 2px solid #DCE9F5; /* Very light blue, almost white-blue border */
            border-radius: 4px;
            width: calc(100% - 24px); /* Adjust width considering 2px border */
            transition: border-color 0.3s ease, box-shadow 0.3s ease; /* Smooth transition */
        }
        input[type="number"]:focus {
            border-color: #003580; /* Primary Finnish blue on focus */
            box-shadow: 0 0 5px rgba(0, 53, 128, 0.5); /* Shadow on focus */
            outline: none; /* Remove default focus outline */
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #003580; /* Primary Finnish blue */
            color: #FFFFFF; /* White text */
            border: 2px solid #002F6C; /* Slightly darker blue border for definition */
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        button:hover {
            background-color: #002F6C; /* Darker blue on hover */
            border-color: #002F6C; /* Maintain darker blue border on hover */
        }
        #result {
            margin-top: 25px; /* Increased margin */
            padding: 15px; /* Increased padding */
            background-color: #F0F8FF; /* AliceBlue, very light clean blue */
            border: 2px solid #003580; /* Primary Finnish blue border */
            border-radius: 4px;
            min-height: 30px;
            color: #002F6C; /* Official dark blue text */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Number to Finnish Text Converter</h1>
        <input type="number" id="numberInput" placeholder="Enter a number">
        <button id="convertButton">Convert</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
